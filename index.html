<style>
:root{--bg:#f3f3f0;--c:#fff;--t:#0a0a0a;--m:#66665f;--line:#e2e2dc;--bd:#8d8d86;--p:#ffd60a;--pt:#0a0a0a;--soft:#ececE6;--e:#d93b3b;--ok:#1f9d55;--blue:#4655f5;--ink:#0a0a0a;--ink-t:#fff;--nav:#0a0a0a;--nav-m:#a8a8a2;--grid:rgba(10,10,10,.05);--wk-bg:#0a0a0a;--wk-t:#f4f4f2;--wk-m:#a8a8a2;--wk-l:#2d2d2b;--wk-bd:#63635e;--wk-s:#1d1d1c;--wk-n:#ffd60a;color-scheme:light}

:root[data-theme=dark]{--bg:#0a0a0a;--c:#151515;--t:#f4f4f2;--m:#a3a39d;--line:#2b2b2a;--bd:#74746e;--soft:#222221;--ink:#f4f4f2;--ink-t:#0a0a0a;--nav:#1f1f1e;--nav-m:#a3a39d;--grid:rgba(255,255,255,.05);--wk-bg:#f4f4f2;--wk-t:#0a0a0a;--wk-m:#5d5d58;--wk-l:#d6d6d0;--wk-bd:#8d8d86;--wk-s:#e7e7e1;--wk-n:#4655f5;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top b{font-size:20px;letter-spacing:-.02em}
.top span{display:flex;align-items:center}
.card{background:var(--c);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:20px;letter-spacing:-.02em}
input,textarea{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1px solid transparent;border-radius:12px;margin:6px 0 10px;background:var(--soft);color:var(--t);outline:0;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--t)}
::placeholder{color:var(--m)}

button{font:inherit;cursor:pointer;color:inherit;transition:transform .12s ease,opacity .12s,background-color .15s,color .15s}

.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--p);color:var(--pt);font-weight:600}
.btn:disabled{opacity:.5}
.sm{padding:8px 14px;border:1px solid var(--line);background:var(--c);color:var(--t);border-radius:999px;margin:8px 8px 0 0;font-size:14px;font-weight:500}
.sm.on{background:var(--p);color:var(--pt);border-color:var(--p)}
label.sm{display:inline-block}
.chip{padding:6px 12px;border:1px dashed var(--m);border-radius:999px;background:transparent;font-size:14px}
.lnk{background:none;border:0;padding:8px 0 8px 14px;font-size:15px;color:var(--m);display:inline-flex;align-items:center}
.msg{color:var(--e);margin:4px 0 8px}

.badge{font-size:13px;color:var(--m)}

.wk{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.wk .lnk{font-size:24px;padding:2px 14px}
.row{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;align-items:start}
.l,.r{min-width:0}
.r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right;align-self:stretch}
.r .sm{margin:0}

.ls{font-weight:600}
.hw{white-space:pre-wrap;word-break:break-word;margin-top:6px}
.l .sm{margin:10px 0 0}
.card.done{opacity:.6}
.ph{display:inline-block;position:relative}
.ph img{width:72px;height:72px;object-fit:cover;border-radius:10px;margin:6px 6px 0 0;display:inline-block}
.x{position:absolute;top:2px;right:8px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:0}
.lrow{display:flex;align-items:center;gap:8px}.lrow b{width:20px}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 60px) 12px calc(env(safe-area-inset-bottom,0px) + 16px);animation:fade .2s ease}
.ov img{display:block;max-width:100%;margin:0 auto 12px;border-radius:12px}

#app.anim .card,#app.anim .tabs{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#app.anim .week{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.sm,.chip{border-width:1.5px;border-color:var(--bd)}
.sm.on{border-color:var(--p)}
.chip{border-style:dashed}
.tabs{border:1.5px solid var(--bd)}
.tab{color:var(--t)}

.wk{margin-bottom:6px}

.ph2{display:flex;gap:10px;margin-bottom:14px}

.pill.grow{flex:1}
button.pill{text-align:center;white-space:nowrap}
.phr{margin:4px 0 14px}

.week{background:var(--c);border:1.5px solid var(--bd);border-radius:26px;padding:6px 16px 8px;margin-bottom:14px;scroll-margin-top:12px}
.wh{font-size:22px;font-weight:700;letter-spacing:-.02em;padding:12px 0 10px}
.dayrow{border-top:1px solid var(--line);padding:10px 0}
.dayh{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;color:var(--t);font-size:17px;padding:2px 0 6px;text-align:left}
.ls2{padding:2px 0;overflow-wrap:anywhere}
.ls2 span{color:var(--m);display:inline-block;min-width:22px}
.hwl{margin:0 0 6px 22px;color:var(--m);font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.hwl .chip{margin-left:6px;padding:3px 10px;font-size:13px}
.prow{display:flex;justify-content:space-between;align-items:center}
.prow .sm{margin:0}
.btn.out{background:transparent;color:var(--t);border:1.5px solid var(--bd);margin:4px 0 6px}
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:min(calc(100% - 24px),496px);display:flex;justify-content:space-around;gap:6px;padding:8px;background:var(--c);border:1.5px solid var(--bd);border-radius:30px;z-index:10}
.bnav button{flex:1;border:0;background:none;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:22px;font-size:11px;font-weight:500}
.bnav button svg{width:24px;height:24px}
.bnav button.on{background:var(--p);color:var(--pt)}
#app.hasnav{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 100px)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet>div{width:min(100%,520px);background:var(--c);border-radius:26px 26px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.qopt{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px;margin-top:8px;border:1.5px solid var(--bd);border-radius:16px;background:none;color:var(--t);font-size:16px}
.qopt.on{background:var(--p);color:var(--pt);border-color:var(--p)}
input,textarea,button{font-family:inherit}
.pill,.sm,.chip,.btn,.arr,.tab{display:inline-flex;align-items:center;justify-content:center;line-height:1.2;text-align:center}

.emg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}

input[type=date],input[type=time]{min-height:48px;-webkit-appearance:none;appearance:none;text-align:left}

/* ===== Новый дизайн: белое/чёрное, жёлтый акцент, серифные заголовки, сетка ===== */
body{font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:36px 36px;background-attachment:fixed}
h3,.top b,.wh,.dh b,.ls b,.pill.grow,.sheet>div>b{font-family:"Playfair Display",Georgia,serif;font-weight:800;letter-spacing:-.01em}
.top b{font-size:26px}h3{font-size:24px}
.card{border-radius:24px;padding:18px;box-shadow:0 12px 30px -20px rgba(0,0,0,.4)}
.ph2{align-items:flex-end;margin:6px 0 20px}
.pill.grow{border:0;background:none;padding:0 0 14px;position:relative;justify-content:flex-start;text-align:left;font-size:clamp(28px,8vw,38px);line-height:1.05}
.pill.grow::after{content:"";position:absolute;left:0;bottom:0;width:64px;height:7px;border-radius:4px;background:var(--p)}
button.pill{background:var(--ink);color:var(--ink-t);border:0;font-size:16px;padding:12px 20px}
.pill.plus{width:52px;height:52px;border-radius:50%;background:var(--p);color:#0a0a0a}
.btn{border-radius:999px;background:var(--p);color:#0a0a0a;font-weight:700;padding:15px}
.sm{font-weight:600}.sm.on{background:var(--p);color:#0a0a0a;border-color:var(--p)}
.arr{border-radius:50%;border:0;background:var(--ink);color:var(--ink-t)}

async function loadNews() {
  const {data} = await sb.from('news').select('*');
  S.news = data || [];
  if (canEdit()) {
    const old = S.news.filter(expired).map(n => n.id);
    if (old.length) { await sb.from('news').delete().in('id', old); S.news = S.news.filter(n => !old.includes(n.id)); }
  }
}

function newsGroups() {
  const today = fmt(new Date()), limit = addDays(today, NEAR_DAYS), near = [], far = [];
  S.news.filter(n => !expired(n)).forEach(n => (n.kind === 'event' && n.event_date > limit ? far : near).push(n));
  const key = n => n.event_date + (n.event_time || '');
  near.sort((a, b) => a.kind === b.kind ? (a.kind === 'event' ? key(a).localeCompare(key(b)) : Date.parse(b.created_at) - Date.parse(a.created_at)) : (a.kind === 'announcement' ? -1 : 1));
  far.sort((a, b) => key(a).localeCompare(key(b)));
  return {near, far};
}

  const ed = canEdit() && !ro;

}

function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error('image')), 'image/jpeg', .82);
    };
    img.onerror = () => rej(new Error('image'));
    img.src = u;
  });
}

async function uploadPhotos(files) {
  if (!S.edit || S.busy) return;
  S.busy = true; S.msg = ''; render();
  try {
    for (const f of files) {
      const img = /^image\//.test(f.type), ext = img ? 'jpg' : ((f.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8) || 'bin');
      const path = `${S.edit.date}/${S.edit.no}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}.${ext}`;
      const {error} = await sb.storage.from(BUCKET).upload(path, img ? await shrink(f) : f, {contentType: img ? 'image/jpeg' : (f.type || 'application/octet-stream')});
      if (error) throw error;
      const {data} = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
      S.urls[path] = data.signedUrl; S.edit.photos.push(path); S.edit.added.push(path);
    }
  } catch (e) { S.msg = errText(e); }
  finally { S.busy = false; render(); }
}

let navIdx = -1, dayIdx = -1;
function slideInd(box, ind, prev) {
  const bs = [...box.querySelectorAll('button')], ni = bs.findIndex(b => b.classList.contains('on'));
  if (!ind) return -1;
  if (ni < 0) { ind.style.display = 'none'; return -1; }
  const place = b => { ind.style.left = b.offsetLeft + 'px'; ind.style.top = b.offsetTop + 'px'; ind.style.width = b.offsetWidth + 'px'; ind.style.height = b.offsetHeight + 'px'; };
  const from = prev >= 0 && prev !== ni ? bs[prev] : null;
  if (from) {
    bs[ni].classList.remove('on'); from.classList.add('on'); place(from);
    requestAnimationFrame(() => requestAnimationFrame(() => { from.classList.remove('on'); bs[ni].classList.add('on'); place(bs[ni]); }));
  } else place(bs[ni]);
  return ni;
}
function render() {

  const nv = a.querySelector('.bnav');

    else if (a === 'nedit') {
      const n = S.news.find(x => x.id === Number(v));
      if (n && canEdit()) { S.nsheet = {id: n.id, kind: n.kind, exp: '', cur: n.expires_at}; S.f.ncustom = ''; S.f.nbody = n.body || ''; S.f.ndate = n.event_date || n.ann_date || ''; S.f.ntime = (n.event_time || '').slice(0, 5); S.f.nplace = n.place || ''; }
    }
    else if (a === 'ndel') {
      if (!confirm(t('delConfirm'))) return;
      const {error} = await sb.from('news').delete().eq('id', S.nsheet.id);
      if (error) throw error;
      S.nsheet = null; await loadNews();
    }
    else if (a === 'savenews') {
      const ns = S.nsheet, ev = ns.kind === 'event', body = (S.f.nbody || '').trim();
      if (!body) throw new Error(t('needText'));
      if (ev && !S.f.ndate) throw new Error(t('needDate'));
      if (ev && S.f.ndate < fmt(new Date())) throw new Error(t('pastDate'));
      const row = {kind: ns.kind, body, event_date: ev ? S.f.ndate : null, event_time: ev && S.f.ntime ? S.f.ntime : null, place: ev ? ((S.f.nplace || '').trim() || null) : null, updated_at: new Date().toISOString()};
      if (!ev) {
        row.ann_date = S.f.ndate || null;
        if (ns.exp) {
          const days = ns.exp === 'c' ? Math.floor(Number(S.f.ncustom)) : Number(ns.exp);
          if (!(days >= 1 && days <= 365)) throw new Error(t('needDays'));
          row.expires_at = new Date(Date.now() + days * 864e5).toISOString();
        }
      }
      const {error} = ns.id ? await sb.from('news').update(row).eq('id', ns.id) : await sb.from('news').insert(row);
      if (error) throw error;
      S.nsheet = null; await loadNews();
    }
    else if (a === 'qopen') { S.qpick = true; }
    else if (a === 'vac') { S.vac = true; }
    else if (a === 'vclose') { S.vac = false; }
    else if (a === 'lesson') { S.detail = v; }
    else if (a === 'dclose') { S.detail = null; }
    else if (a === 'qclose') { S.qpick = false; }
    else if (a === 'q') { S.q = Number(v); S.qpick = false; S.open = null; S.scroll = true; await loadDiary(true); }
    else if (a === 'fday') { S.open = S.open === v ? null : v; }
    else if (a === 'sedit') { if (canEdit()) { initSched(); S.sedit = true; } }
    else if (a === 'sback') { S.sedit = false; S.scroll = true; await loadDiary(true); }
    else if (a === 'todiary') { const d = parse(v); S.week = fmt(mondayOf(d)); S.day = (d.getDay() + 6) % 7 + 1; S.tab = 'diary'; S.detail = null; await loadDiary(); }
    else if (a === 'out') { try { await sb.auth.signOut({scope: 'local'}); } catch (e) {} S.user = null; S.profile = null; S.view = 'login'; S.f = {}; S.edit = null; S.sched = null; S.sedit = false; S.tab = 'diary'; }
    else if (a === 'role') {
      const [id, role] = v.split('|');
      const {error} = await sb.from('profiles').update({role}).eq('id', id);
      if (error) throw error;
      await loadPeople();
    }
    else if (a === 'udel') {
      if (!confirm(t('udelConfirm'))) return;
      const {error} = await sb.rpc('delete_user', {p_id: v});
      if (error) throw error;
      await loadPeople();
    }
    else if (a === 'theme') { setTheme(dark() ? 'light' : 'dark'); }
    else if (a === 'photos') { const w = S.hw[v]; S.viewer = ((w && w.photo_paths) || []).map(x => S.urls[x]).filter(Boolean); }
    else if (a === 'file') {
      const w = S.hw[v], ps = ((w && w.photo_paths) || []).filter(x => S.urls[x]);
      S.fv = await Promise.all(ps.map(async x => {
        const e = extOf(x), kind = IMG.includes(e) ? 'img' : TXT.includes(e) ? 'txt' : 'other';
        let text = '';
        if (kind === 'txt') { try { text = (await (await fetch(S.urls[x])).text()).slice(0, 20000); } catch (er) {} }
        return {p: x, kind, url: S.urls[x], text, name: fname(x)};
      }));
    }
    else if (a === 'fclose') { S.fv = null; }
    else if (a === 'dl') {
      for (const x of (v ? [v] : S.fv.map(f => f.p))) {
        const {data, error} = await sb.storage.from(BUCKET).createSignedUrl(x, 120, {download: fname(x)});
        if (error) throw error;
        const l = document.createElement('a'); l.href = data.signedUrl; l.click();
      }
    }
    else if (a === 'closeview') { S.viewer = null; }
    else if (a === 'done') {
      const id = Number(v);
      if (S.done.has(id)) {
        const {error} = await sb.from('homework_done').delete().eq('homework_id', id).eq('user_id', S.user.id);
        if (error) throw error;
        S.done.delete(id);
      } else {
        const {error} = await sb.from('homework_done').insert({homework_id: id, user_id: S.user.id});
        if (error) throw error;
        S.done.add(id); S.pop = id;
      }
    }
    else if (a === 'week') { S.week = addDays(S.week, 7 * Number(v)); S.edit = null; await loadDiary(); }
    else if (a === 'day') { S.day = S.day === Number(v) ? null : Number(v); S.edit = null; }
    else if (a === 'sday') { S.sched.day = Number(v); }
    else if (a === 'edit') {
      const no = Number(v), date = dayDate(), w = S.hw[date + '|' + no];
      S.edit = {date, no, subject: (subjects(date) || {})[no] || '', photos: [...(w ? w.photo_paths || [] : [])], removed: [], added: [], wt: (w && w.work_type) || '', wt0: (w && w.work_type) || ''};
      S.f.hwbody = w && w.body || '';
    }
    else if (a === 'wt') { S.edit.wt = S.edit.wt === v ? '' : v; }
    else if (a === 'setwt') {
      if (!canEdit() || !S.detail) return;
      const [d, no] = S.detail.split('|'), w = S.hw[S.detail];
      const row = {lesson_date: d, lesson_no: Number(no), work_type: w && w.work_type === v ? null : v, updated_by: S.user.id, updated_at: new Date().toISOString()};
      if (!w) { row.created_by = S.user.id; row.photo_paths = []; }
      const {error} = await sb.from('homework').upsert(row, {onConflict: 'lesson_date,lesson_no'});
      if (error) throw error;
      await loadDiary(true);
    }
    else if (a === 'rmphoto') { S.edit.photos = S.edit.photos.filter(p => p !== v); S.edit.removed.push(v); }
    else if (a === 'cancel') {
      if (S.edit.added.length) await sb.storage.from(BUCKET).remove(S.edit.added);
      S.edit = null;
    }
    else if (a === 'savehw') {
      const e = S.edit, key = e.date + '|' + e.no;
      const row = {lesson_date: e.date, lesson_no: e.no, body: (S.f.hwbody || '').trim() || null,
        photo_paths: e.photos, updated_by: S.user.id, updated_at: new Date().toISOString()};
      if (!S.hw[key]) row.created_by = S.user.id;
      if (e.wt !== e.wt0) row.work_type = e.wt || null;
      const {error} = await sb.from('homework').upsert(row, {onConflict: 'lesson_date,lesson_no'});
      if (error) throw error;
      if (e.removed.length) await sb.storage.from(BUCKET).remove(e.removed);
      S.edit = null; await loadDiary();
    }
    else if (a === 'savesched') {
      if (!S.f.sfrom) throw new Error('date');
      const from = fmt(mondayOf(parse(S.f.sfrom))); S.f.sfrom = from;
      const old = S.versions.find(x => x.effective_from === from); let id;
      if (old) {
        id = old.id;
        const {error} = await sb.from('schedule_slots').delete().eq('version_id', id);
        if (error) throw error;
      } else {
        const {data, error} = await sb.from('schedule_versions').insert({effective_from: from, created_by: S.user.id}).select('id').single();
        if (error) throw error;
        id = data.id;
      }
      const rows = [];
      for (let d = 1; d <= 5; d++) for (let n = 1; n <= 8; n++) {
        const sub = (S.f['s_' + d + '_' + n] || '').trim();
        if (sub) rows.push({version_id: id, weekday: d, lesson_no: n, subject: sub});
      }
      if (rows.length) { const {error} = await sb.from('schedule_slots').insert(rows); if (error) throw error; }
      await loadDiary(); S.info = t('saved');
    }
    else if (a === 'login') {
      const {error} = await sb.auth.signInWithPassword({email, password: S.f.password || ''});
      if (error) {
        if (/not confirmed/i.test(error.message)) {
          await sb.auth.resend({type:'signup', email});
          S.email = email; S.otpType = 'signup'; S.view = 'verify'; S.info = t('sent'); return;
        }
        throw error;
      }
    }
    else if (a === 'signup') {
      const {error} = await sb.auth.signUp({email, password: S.f.password || ''});
      if (error) throw error;
      S.email = email; S.otpType = 'signup'; S.view = 'verify'; S.info = t('sent');
    }
    else if (a === 'forgot') {
      const {error} = await sb.auth.resetPasswordForEmail(email);
      if (error) throw error;
      S.email = email; S.otpType = 'recovery'; S.view = 'verify'; S.info = t('sent');
    }
    else if (a === 'verify') {
      S.recovering = S.otpType === 'recovery';
      const {error} = await sb.auth.verifyOtp({email: S.email, token: (S.f.code || '').trim(), type: S.otpType});
      if (error) { S.recovering = false; throw error; }
      S.f.code = '';
    }
    else if (a === 'newpass') {
      const {error} = await sb.auth.updateUser({password: S.f.password || ''});
      if (error) throw error;
      S.recovering = false; S.f = {};
      await load();
    }
  } catch (e) {
    S.msg = errText(e);
  } finally {
    S.busy = false;
    render();
    if (['tab', 'day', 'week', 'go', 'sday', 'out', 'q', 'todiary', 'sback', 'sedit'].includes(a)) {
      const el = document.getElementById('app'); el.classList.add('anim');
      setTimeout(() => el.classList.remove('anim'), 700);
    }
  }
}

const app = document.getElementById('app');
app.addEventListener('input', e => { if (e.target.name) S.f[e.target.name] = e.target.value; });
app.addEventListener('change', e => { if (e.target.id === 'hwfile') uploadPhotos([...e.target.files]); });
app.addEventListener('submit', e => { e.preventDefault(); act(e.target.dataset.s); });
app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b && !(b.classList.contains('sheet') && e.target.closest('.sheet>div'))) act(b.dataset.a, b.dataset.v);
});

sb.auth.onAuthStateChange((ev, sess) => {
  if (ev === 'PASSWORD_RECOVERY') S.recovering = true;
  S.user = sess ? sess.user : null;
  setTimeout(load, 0);
});
setTimeout(() => { if (!S.ready) load(); }, 3000);
document.addEventListener('touchstart', () => {}, {passive: true});
matchMedia('(min-width:1000px)').addEventListener('change', () => render());
let lastDay = fmt(new Date());
document.addEventListener('visibilitychange', () => {
  const n = fmt(new Date());
  if (document.hidden || n === lastDay) return;
  lastDay = n;
  if (!S.edit && S.user) { goToday(); load(); }
});
render();
</script>
</body>
</html>
