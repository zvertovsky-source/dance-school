<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Школа танцев</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
.top nav{display:flex}.top nav button{font:inherit;color:var(--brand-ink);background:none;border:0;padding:8px 14px;border-radius:8px;cursor:pointer}
.top nav button.on{background:var(--brand-ink);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 8px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left}
.row:hover{background:#F6F4FB}.row:first-child{border-top:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.back{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0 0 10px}
#drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100%;background:#fff;border-left:1px solid var(--line);padding:22px;overflow:auto;transform:translateX(100%);transition:transform .2s;z-index:20;box-shadow:-8px 0 24px #231B3A22}
#drawer.open{transform:none}
#drawer dl{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;margin:14px 0}#drawer dt{color:var(--mute);font-size:.9rem}#drawer dd{margin:0}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline}
.tg{font:inherit;font-weight:600;min-width:80px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
.tg.yes{background:var(--ok);border-color:var(--ok);color:#fff}.tg.no{background:var(--warn);border-color:var(--warn);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.chips button{font:inherit;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;white-space:nowrap}.chips .on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.ed{min-width:1500px}.ed td{padding:3px 4px}.ed input{width:100%;min-width:110px;border:1px solid transparent;background:transparent;padding:6px 8px}.ed input:hover,.ed input:focus{border-color:var(--line);background:#fff}
@media(max-width:700px){.ed{min-width:0}.ed thead{display:none}.ed tr{display:block;border:1px solid var(--line);border-radius:10px;margin:0 0 12px;padding:8px}.ed td{display:flex;gap:8px;align-items:center;border:0;padding:3px 0}.ed td::before{content:attr(data-label);flex:0 0 92px;color:var(--mute);font-size:.82rem}.ed td input{min-width:0}}
.fl{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.fl label{display:flex;flex-direction:column;font-size:.82rem;color:var(--mute);gap:3px}.fl input,.fl select{min-width:120px}
.btn.big{font-size:1.1rem;padding:16px 28px}.cbtn{padding:6px 12px;font-size:.9rem;white-space:nowrap}
.ta{width:100%;resize:none;overflow:hidden;font:inherit;line-height:1.35;padding:6px 8px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--ink)}.ta:hover,.ta:focus{border-color:var(--line);background:#fff}
.ed td[data-label=""]::before{display:none}.ed td textarea.ta{min-width:0!important}
.ov{position:fixed;inset:0;background:#10261F88;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:40}
.mdl{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px}.mdl label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--mute)}.mdl input,.mdl select,.mdl textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink);width:100%}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:30}
#inv{position:absolute;left:-9999px;top:0;width:680px;padding:36px;background:#fff;color:#000;font-family:Arial,sans-serif;font-size:14px}
#inv table{min-width:0}#inv th,#inv td{border-bottom:1px solid #ccc}
@media(max-width:700px){.top{padding:12px 16px}.top nav{position:fixed;bottom:0;left:0;right:0;background:var(--brand);justify-content:space-around;padding:6px;z-index:10}.top nav button{padding:10px 6px;font-size:.78rem}main{padding-bottom:90px}
#drawer{top:auto;width:100%;max-height:85vh;border-left:0;border-radius:16px 16px 0 0;transform:translateY(100%)}#drawer.open{transform:none}}
</style></head><body>
<header class="top"><b>Школа танцев</b><nav id="nav"></nav></header>
<main class="page" id="v"></main>
<aside id="drawer" aria-label="Карточка"></aside><div id="toast"></div><div id="modal"></div><div id="inv"></div>
<script>
/* ДЕМО-ДАННЫЕ: заменяются данными из Supabase */
let T=[],G=[],K=[],A={};
const S={tab:'kids',t:null,g:null,drawer:null,gv:'kids',gq:'',tq:'',tc:'',tp:0,tf:0,tt:0,a1:'',a2:'',ty:'',ts:'az',pp:100,cg:false,pk:1,from:monthRange(0)[0],to:monthRange(0)[1],ag:1,ad:new Date().toISOString().slice(0,10),q:''};
const $=id=>document.getElementById(id),tn=id=>T.find(t=>t.id==id).n,gn=id=>{const g=G.find(x=>x.id==id);return tn(g.t)+' · '+g.n};
const kidsOf=g=>K.filter(k=>k.g.includes(g));
const TABS=[['kids','Ученики'],['groups','Группы'],['teachers','Учителя'],['pay','Оплаты']];
const grow=e=>{e.style.height='auto';e.style.height=(e.scrollHeight+2)+'px'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const season=c=>{const m=(c||'').match(/от\s+(\d{1,2})\.(\d{1,2})\.(\d{4})/);if(!m)return'';const y=+m[3];return +m[2]>=8?y+'/'+String(y+1).slice(2):(y-1)+'/'+String(y).slice(2)};
const gLabel=g=>{const x=G.find(y=>y.id==g);return x?tn(x.t)+' · '+x.n+(x.s?' ('+x.s+')':''):''};
const age=d=>d?Math.max(0,Math.floor((Date.now()-new Date(d))/31557600000)):'';
const today=()=>new Date().toISOString().slice(0,10);
const BASE='2000-01-01';
function monthRange(o){const d=new Date(),y=d.getFullYear(),m=d.getMonth()+o;return [new Date(Date.UTC(y,m,1)).toISOString().slice(0,10),new Date(Date.UTC(y,m+1,0)).toISOString().slice(0,10)]}
function period(o){const r=monthRange(o);S.from=r[0];S.to=r[1];draw()}
let PT=[],PH={},TU={};
const MAP={n:'full_name',par:'parent_name',tel:'phone',em:'email',dog:'contract',note:'notes',dobI:'birth_date',trialI:'trial_date'};
function go(tab,o={}){Object.assign(S,{tab,gv:'kids',gq:''},o);S.drawer=null;draw()}
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2800)}
const kidRow=k=>`<button class="row" onclick="S.drawer=${k.id};draw()"><span>${esc(k.n)}</span><span class="muted">${k.g.map(g=>G.find(x=>x.id==g).n).join(', ')}</span></button>`;
const grpBlock=g=>`<button class="back" onclick="S.g=null;draw()">← Назад</button><h2>${gn(g)}</h2><p class="muted">${G.find(x=>x.id==g).s} · ${kidsOf(g).length} учеников</p>${kidsOf(g).map(kidRow).join('')}`;
function view(){const t=S.tab;
if(t=='kids'){const ad=IS_ADMIN(),q=S.tq.toLowerCase(),cq=S.tc.trim().toLowerCase(),a1=S.a1===''?null:+S.a1,a2=S.a2===''?null:+S.a2,ro=ad?'':' readonly';
const gs=g=>G.find(x=>x.id==g),seas=[...new Set(K.map(k=>season(k.dog)).filter(Boolean))].sort();
let rs=K.filter(k=>{if(q&&!(k.n+' '+k.par+' '+k.tel+' '+k.em+' '+k.note).toLowerCase().includes(q))return false;
if(cq){const lead=(k.dog.match(/^\s*(\d+)/)||[])[1]||'';if(/^\d+$/.test(cq)?!lead.startsWith(cq):!k.dog.toLowerCase().includes(cq))return false}
if(S.tf==-1?k.g.length:(S.tf&&!k.g.includes(S.tf)))return false;if(S.tt&&!k.g.some(g=>gs(g)&&gs(g).t==S.tt))return false;
if(a1!=null||a2!=null){const a=age(k.dobI);if(a==='')return false;if(a1!=null&&a<a1)return false;if(a2!=null&&a>a2)return false}
if(S.ty&&(S.ty=='none'?season(k.dog)!=='':season(k.dog)!==S.ty))return false;return true});
const cmp={az:(a,b)=>a.n.localeCompare(b.n,'ru'),za:(a,b)=>b.n.localeCompare(a.n,'ru'),ageup:(a,b)=>(age(a.dobI)===''?999:age(a.dobI))-(age(b.dobI)===''?999:age(b.dobI)),agedown:(a,b)=>(age(b.dobI)===''?-1:age(b.dobI))-(age(a.dobI)===''?-1:age(a.dobI)),grp:(a,b)=>gLabel(a.g[0]||0).localeCompare(gLabel(b.g[0]||0),'ru')}[S.ts];rs=rs.slice().sort(cmp);
const per=S.pp||rs.length||1,pages=Math.max(1,Math.ceil(rs.length/per));S.tp=Math.min(S.tp,pages-1);
const inp=(k,f,ty,lb)=>`<input type="${ty||'text'}" value="${esc(k[f])}" onchange="edit(${k.id},'${f}',this.value)" aria-label="${lb||f}"${ro}>`,
ta=(k,f,w,lb,multi)=>`<textarea class="ta" rows="1" style="min-width:${w}px" aria-label="${lb}" onchange="edit(${k.id},'${f}',this.value)" oninput="grow(this)" ${multi?'':`onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"`}${ro}>${esc(k[f])}</textarea>`;
return `<h1>Ученики</h1><p class="muted">Всего учеников в таблице: ${K.length}. ${ad?'Нажмите на ячейку, чтобы изменить значение: оно сохраняется сразу.':''}</p>
${ad?`<div class="bar"><button class="btn big" onclick="openAdd()">+ Добавить ученика</button>${K.length?`<button class="btn ghost" onclick="exportXlsx()">Скачать таблицу в Excel</button>`:''}</div>`:''}
${ad&&!K.length?'<section class="card" style="margin-bottom:14px"><p>В базе пока нет учеников. Таблица записывается в базу один раз: выполните файлы из папки <b>supabase/seed</b> (шаг 5 в ИНСТРУКЦИЯ.md).</p></section>':''}
<section class="card"><div class="fl"><label>Поиск<input id="tq" type="search" value="${esc(S.tq)}" placeholder="ФИО, родитель, телефон" oninput="S.tq=this.value;S.tp=0;draw(1)"></label>
<label>По номеру договора<input id="tc" type="search" value="${esc(S.tc)}" placeholder="например, 680" style="min-width:150px" oninput="S.tc=this.value;S.tp=0;draw(1)"></label>
<label>Возраст от<input id="a1" inputmode="numeric" value="${esc(S.a1)}" style="min-width:70px;width:70px" oninput="S.a1=this.value.replace(/\D/g,'');S.tp=0;draw(1)"></label><label>до<input id="a2" inputmode="numeric" value="${esc(S.a2)}" style="min-width:70px;width:70px" oninput="S.a2=this.value.replace(/\D/g,'');S.tp=0;draw(1)"></label>
<label>Учебный год (по дате договора)<select onchange="S.ty=this.value;S.tp=0;draw()"><option value="">Все</option>${seas.map(y=>`<option ${y==S.ty?'selected':''}>${y}</option>`).join('')}<option value="none" ${S.ty=='none'?'selected':''}>Не указан</option></select></label>
<label>Преподаватель<select onchange="S.tt=+this.value;S.tp=0;draw()"><option value="0">Все</option>${T.map(x=>`<option value="${x.id}" ${x.id==S.tt?'selected':''}>${esc(x.n)}</option>`).join('')}</select></label>
<label>Группа<select onchange="S.tf=+this.value;S.tp=0;draw()"><option value="0">Все</option><option value="-1" ${S.tf==-1?'selected':''}>Без группы</option>${G.map(g=>`<option value="${g.id}" ${g.id==S.tf?'selected':''}>${esc(gn(g.id))}</option>`).join('')}</select></label>
<label>Сортировка<select onchange="S.ts=this.value;draw()">${[['az','По алфавиту А→Я'],['za','По алфавиту Я→А'],['ageup','Возраст: младшие сначала'],['agedown','Возраст: старшие сначала'],['grp','По группе']].map(o=>`<option value="${o[0]}" ${o[0]==S.ts?'selected':''}>${o[1]}</option>`).join('')}</select></label>
<label>Показывать<select onchange="S.pp=+this.value;S.tp=0;draw()">${[[50,'50'],[100,'100'],[300,'300'],[0,'Все']].map(o=>`<option value="${o[0]}" ${o[0]==S.pp?'selected':''}>${o[1]}</option>`).join('')}</select></label></div>
<p class="muted" style="margin-top:12px">Найдено: ${rs.length}${(a1!=null||a2!=null)?' (у учеников без даты рождения возраст неизвестен, они скрыты)':''}</p>
<div class="scroll"><table class="ed"><thead><tr><th></th><th>№</th><th>Договор</th><th>ФИО</th><th>Дата рожд.</th><th>Возр.</th><th>Родитель</th><th>Телефон</th><th>E-mail</th><th>Пробное</th><th>Примечания</th><th>Преподаватель · группа (расписание)</th></tr></thead><tbody>${rs.slice(S.tp*per,S.tp*per+per).map((k,i)=>`<tr><td data-label=""><button class="btn cbtn" onclick="S.drawer=${k.id};draw()">Карточка</button></td><td data-label="№" class="muted">${S.tp*per+i+1}</td><td data-label="Договор">${ta(k,'dog',130,'Договор')}</td><td data-label="ФИО">${ta(k,'n',230,'ФИО')}</td><td data-label="Дата рожд.">${inp(k,'dobI','date','Дата рождения')}</td><td data-label="Возраст" class="muted">${age(k.dobI)}</td><td data-label="Родитель">${ta(k,'par',200,'Родитель')}</td><td data-label="Телефон">${ta(k,'tel',140,'Телефон')}</td><td data-label="E-mail">${ta(k,'em',190,'E-mail')}</td><td data-label="Пробное">${inp(k,'trialI','date','Дата пробного занятия')}</td><td data-label="Примечания">${ta(k,'note',220,'Примечания',1)}</td><td data-label="Группы" class="muted">${k.g.map(g=>esc(gLabel(g))).join('<br>')||'—'}</td></tr>`).join('')||'<tr><td colspan="12" class="muted">Никого не нашли: измените поиск или фильтры</td></tr>'}</tbody></table></div>
<div class="bar"><button class="btn ghost" ${S.tp?'':'disabled'} onclick="S.tp--;draw()">←</button><span class="muted">Стр. ${S.tp+1} из ${pages}</span><button class="btn ghost" ${S.tp<pages-1?'':'disabled'} onclick="S.tp++;draw()">→</button></div></section>`}
if(t=='groups'){if(S.g)return groupPage(S.g);return `<h1>Группы</h1>${IS_ADMIN()?`<div class="bar"><button class="btn" onclick="S.cg=!S.cg;draw()">+ Создать группу</button></div>${S.cg?groupForm():''}`:''}<section class="card">${G.map(g=>`<button class="row" onclick="S.g=${g.id};draw()"><span>${esc(tn(g.t))} · ${esc(g.n)}</span><span class="muted">${esc(g.s)} · ${kidsOf(g.id).length} уч.${IS_ADMIN()?' · '+g.p+' BYN':''}</span></button>`).join('')||'<p class="muted">Групп пока нет</p>'}</section>`}
if(t=='teachers'){if(S.g)return groupPage(S.g);
if(S.t){return `<section class="card"><button class="back" onclick="S.t=null;draw()">← Все учителя</button><h2>${tn(S.t)}</h2>${G.filter(g=>g.t==S.t).map(g=>`<button class="row" onclick="S.g=${g.id};draw()"><span>${g.n}</span><span class="muted">${g.s} · ${kidsOf(g.id).length} уч.</span></button>`).join('')}</section>`}
return `<h1>Учителя</h1><div class="cols" style="margin-top:14px">${T.map(t=>`<button class="card row" style="border:1px solid var(--line)" onclick="S.t=${t.id};draw()"><span><b>${t.n}</b><br><span class="muted">${G.filter(g=>g.t==t.id).length} групп</span></span><span class="muted">${K.filter(k=>k.g.some(g=>G.find(x=>x.id==g).t==t.id)).length} уч.</span></button>`).join('')}</div>`}
if(t=='pay'){const k=K.find(x=>x.id==S.pk);if(!k)return '<h1>Оплаты</h1><p class="muted">Нет учеников</p>';const L=lines(k);return `<h1>Оплаты</h1><section class="card"><div class="bar"><select onchange="S.pk=+this.value;draw()" aria-label="Ученик">${K.map(x=>`<option value="${x.id}" ${x.id==S.pk?'selected':''}>${esc(x.n)}</option>`).join('')}</select><label>с <input type="date" value="${S.from}" onchange="S.from=this.value;draw()"></label><label>по <input type="date" value="${S.to}" onchange="S.to=this.value;draw()"></label><button class="btn ghost" onclick="period(0)">Этот месяц</button><button class="btn ghost" onclick="period(-1)">Прошлый месяц</button></div><div class="scroll"><table><thead><tr><th>Группа</th><th class="num">Занятий</th><th class="num">Цена</th><th class="num">Сумма</th></tr></thead><tbody>${L.rows.map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num">${r[2]} BYN</td><td class="num">${r[3]} BYN</td></tr>`).join('')}<tr><td colspan="3"><b>Итого к оплате</b></td><td class="num"><b>${L.total} BYN</b></td></tr></tbody></table></div>
<div class="bar"><input id="to" type="email" value="${k.em}" placeholder="E-mail родителя" style="flex:1;min-width:220px"><button class="btn ghost" onclick="pdf(0)">Скачать PDF</button><button class="btn ghost" onclick="mailTo()">Открыть в почте</button><button class="btn" onclick="pdf(1)">Отправить родителю</button></div>${k.em?'':'<p class="muted">У ребёнка не указан e-mail — введите его вручную.</p>'}</section>`}}
const priceOn=(g,d)=>{const x=G.find(y=>y.id==g);if(!x.ph)return x.p;let p=0;for(const h of x.ph)if(h.f<=d)p=h.p;return p};
const lessonDates=g=>[...new Set(Object.keys(A).filter(x=>x.split('|')[1]==g).map(x=>x.split('|')[2]).concat([S.ad]))].sort().slice(-8);
function lines(k,pf=S.from,pt2=S.to){const gs=[...new Set(k.g.concat(Object.keys(A).filter(x=>x.split("|")[0]==k.id).map(x=>+x.split("|")[1])))].filter(g=>G.find(x=>x.id==g));const rows=gs.map(g=>{const ds=Object.keys(A).filter(x=>{const [a,b,c]=x.split('|');return a==k.id&&b==g&&c>=pf&&c<=pt2&&A[x]===1}).map(x=>x.split('|')[2]);const sum=ds.reduce((s,d)=>s+priceOn(g,d),0);return [gn(g),ds.length,ds.length?+(sum/ds.length).toFixed(2):G.find(x=>x.id==g).p,+sum.toFixed(2)]});return {rows,total:+rows.reduce((s,r)=>s+r[3],0).toFixed(2)}}
let GU={},KU={},EU={},LS={},ME=null;
const IS_ADMIN=()=>!window.sb||(ME&&ME.role==='admin');
async function saveAtt(g,list){const d=S.ad,prev={};list.forEach(([k,v])=>{const key=k+'|'+g+'|'+d;prev[key]=A[key];A[key]=v});draw();if(!window.sb)return;
try{let l=LS[g+'|'+d];if(!l){const {data,error}=await sb.from('lessons').upsert({group_id:GU[g],lesson_date:d},{onConflict:'group_id,lesson_date'}).select('id').single();if(error)throw error;l=LS[g+'|'+d]=data.id}
const {error}=await sb.from('attendance').upsert(list.map(([k,v])=>({lesson_id:l,enrollment_id:EU[k+'|'+g],present:!!v})));if(error)throw error}
catch(e){toast('Не сохранено: '+e.message);for(const key in prev){if(prev[key]===undefined)delete A[key];else A[key]=prev[key]}draw()}}
const mark=(k,g,v)=>saveAtt(g,[[k,v]]);
const markAll=(g,v)=>saveAtt(g,kidsOf(g).map(k=>[k.id,v]));
function monthStat(k,g,m){const ds=Object.keys(A).filter(x=>{const [a,b,c]=x.split('|');return a==k&&b==g&&c.startsWith(m)&&A[x]===1}).map(x=>x.split('|')[2]);return [ds.length,+ds.reduce((s,d)=>s+priceOn(g,d),0).toFixed(2)]}
async function pdf(send){const k=K.find(x=>x.id==S.pk),L=lines(k),to=($('to')||{}).value;

async function all(t,sel,ord){let o=[],f=0;for(;;){const {data,error}=await sb.from(t).select(sel).order(ord).range(f,f+999);if(error)throw error;o=o.concat(data);if(data.length<1000)return o;f+=1000}}

const ti={},gi={},ki={},td=today();GU={};KU={};EU={};LS={};A={};TU={};PH={};
T=t.map((x,i)=>(ti[x.id]=i+1,TU[i+1]=x.id,{id:i+1,n:x.name}));PT=pt.map((x,i)=>({id:i+1,n:x.name,u:x.id}));
pr.sort((a,b)=>a.valid_from<b.valid_from?-1:1).forEach(x=>(PH[x.price_type_id]=PH[x.price_type_id]||[]).push({f:x.valid_from,p:+x.price}));
G=g.filter(x=>IS_ADMIN()||x.teacher_id==ME.teacher_id).map((x,i)=>{gi[x.id]=i+1;GU[i+1]=x.id;const h=PH[x.price_type_id]||[];return {id:i+1,t:ti[x.teacher_id],n:x.name,s:x.schedule||'',pt:x.price_type_id||null,ph:h,p:(h.filter(y=>y.f<=td).pop()||{p:0}).p}});
K=c.map((x,i)=>(ki[x.id]=i+1,KU[i+1]=x.id,{id:i+1,n:x.full_name,dobI:x.birth_date||'',trialI:x.trial_date||'',par:x.parent_name||'',tel:x.phone||'',em:x.email||'',dog:x.contract||'',note:x.notes||'',g:[]}));
e.forEach(x=>{if(x.end_date&&x.end_date<td)return;const k=K[ki[x.child_id]-1],gg=gi[x.group_id];if(k&&gg){if(!k.g.includes(gg))k.g.push(gg);EU[k.id+'|'+gg]=x.id}});
at.forEach(x=>{const en=x.enrollments,l=x.lessons;if(!en||!l)return;const k=ki[en.child_id],gg=gi[en.group_id];if(k&&gg){A[k+'|'+gg+'|'+l.lesson_date]=x.present?1:0;LS[gg+'|'+l.lesson_date]=l.id}});

function groupPage(gid){if(S.gv=='att')return attPage(gid);const g=G.find(x=>x.id==gid),ad=IS_ADMIN();return `<section class="card"><button class="back" onclick="S.g=null;S.gv='kids';S.gq='';draw()">← Назад</button><h2>${esc(gn(gid))}</h2>${ad?`<div class="bar"><label class="muted">Расписание: <input value="${esc(g.s)}" onchange="setSched(${gid},this.value)"></label></div>`:`<p class="muted">${esc(g.s)}</p>`}${ad?priceBox(g):''}<div class="bar"><button class="btn" onclick="S.gv='att';draw()">Отметить посещаемость</button>${ad?`<button class="btn ghost" style="color:#B3261E" onclick="delGroup(${gid})">Удалить группу</button>`:''}</div><p class="muted">${kidsOf(gid).length} учеников</p>${kidsOf(gid).map(k=>ad?gKid(k,gid):kidRow(k)).join('')||'<p class="muted">В группе пока нет учеников</p>'}${ad?`<div style="margin-top:14px"><input id="gsq" type="search" value="${esc(S.gq)}" placeholder="Найти ученика, чтобы добавить в группу" style="width:100%" oninput="S.gq=this.value;draw(1)">${addRes(gid)}</div>`:''}</section>`}

const groupForm=()=>`<section class="card" style="margin:14px 0"><h2>Новая группа</h2><div class="bar"><select id="gt" aria-label="Преподаватель">${T.map(t=>`<option value="${t.id}">${esc(t.n)}</option>`).join('')}</select><button class="lnk" onclick="addTeacher()">+ новый преподаватель</button><input id="gnm" placeholder="Название, например 7-9 лет"><input id="gs" placeholder="Расписание, например вт/чт 17:20"><input id="gp" type="number" min="0" step="0.5" placeholder="Цена занятия, BYN" aria-label="Цена занятия" style="width:170px"><button class="btn" onclick="createGroup()">Создать</button></div></section>`;
async function edit(id,f,val){const k=K.find(x=>x.id==id),old=k[f];val=val.trim();if(f=='n'&&!val){toast('ФИО не может быть пустым');draw(1);return}k[f]=val;
if(!window.sb){toast('Демо: изменено только на странице');return}
const {error}=await sb.from('children').update({[MAP[f]]:val||null}).eq('id',KU[id]);if(error){k[f]=old;draw();toast('Не сохранено: '+error.message)}else toast('Сохранено')}
async function addToGroup(kid,g){const k=K.find(x=>x.id==kid);if(k.g.includes(g))return toast('Уже в этой группе');
if(window.sb){const {data,error}=await sb.from('enrollments').insert({child_id:KU[kid],group_id:GU[g],start_date:today()}).select('id').single();if(error){toast('Не сохранено: '+error.message);draw();return}EU[kid+'|'+g]=data.id}
k.g.push(g);draw();toast('Добавлено в группу')}
async function rmFromGroup(kid,g){const k=K.find(x=>x.id==kid);if(!confirm('Убрать ученика из группы? Прошлые отметки сохранятся.'))return;
if(window.sb){const {error}=await sb.from('enrollments').update({end_date:today()}).eq('id',EU[kid+'|'+g]);if(error)return toast('Не сохранено: '+error.message);delete EU[kid+'|'+g]}
k.g=k.g.filter(x=>x!=g);draw();toast('Убран из группы')}

async function createGroup(){const t=+$('gt').value,n=$('gnm').value.trim(),s=$('gs').value.trim(),pr=parseFloat(($('gp').value||'').replace(',','.'));if(!n||!t)return toast('Укажите преподавателя и название');if(!(pr>=0))return toast('Укажите цену одного занятия');
const id=G.reduce((m,g)=>Math.max(m,g.id),0)+1;let pt=null;const ph=[{f:BASE,p:pr}];
if(window.sb){const a=await sb.from('price_types').insert({name:'Цена: '+tn(t)+' · '+n+' · '+Date.now().toString(36)}).select('id').single();if(a.error)return toast('Не сохранено: '+a.error.message);pt=a.data.id;

G.push({id,t,n,s,pt,ph,p:pr});S.cg=false;S.g=id;draw();toast('Группа создана: добавьте учеников')}
async function setPrice(gid){const x=G.find(y=>y.id==gid),pr=parseFloat(($('np').value||'').replace(',','.')),from=$('nf').value||today();if(!(pr>=0))return toast('Введите цену числом');

const b=await sb.from('prices').insert(nph.map(h=>({price_type_id:nt,price:h.p,valid_from:h.f})));if(b.error){await sb.from('price_types').delete().eq('id',nt);throw b.error}

else{const b=await sb.from('prices').upsert({price_type_id:pt,price:pr,valid_from:vf},{onConflict:'price_type_id,valid_from'});if(b.error)throw b.error}}
catch(e){return toast('Не сохранено: '+e.message)}}
x.pt=pt;x.ph=nph;if(pt)PH[pt]=nph;x.p=(nph.filter(h=>h.f<=today()).pop()||nph[0]).p;draw();toast('Цена сохранена')}

async function delGroup(gid){const n=kidsOf(gid).length;if(!confirm('Удалить группу «'+gn(gid)+'» навсегда? Будут удалены её отметки посещаемости и записи '+n+' учеников в эту группу (сами ученики останутся). Отменить нельзя.'))return;
