<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>Посещаемость</title>
<style>
.kid{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.kid .btns{display:flex;gap:6px}
.tg{font:inherit;font-weight:600;min-width:84px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.tg.yes{background:var(--ok);border-color:var(--ok);color:#fff}.tg.no{background:var(--warn);border-color:var(--warn);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips button{font:inherit;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cell{width:40px;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font:inherit}
.cell.yes{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.cell.no{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
#desk{display:none}
@media(min-width:900px){#mob{display:none}#desk{display:block}}
</style></head><body><header class="top"><b>Школа танцев</b><nav><a href="attendance.html">Посещаемость</a><a href="teachers.html">Преподаватели</a><a href="prices.html">Цены</a><a href="admin.html">Платежи</a><a href="parent.html">Вид родителя</a></nav></header>
<div class="page"><h1>Посещаемость</h1>
<div class="bar"><select id="g" aria-label="Группа"><option>Доброгост · 7–9 лет · вт/чт 17:20</option><option>Доброгост · 4–6 лет · вт/чт 18:20</option></select><select aria-label="Месяц"><option>Октябрь 2026</option></select></div>
<section class="card" id="mob"><div class="chips" id="chips"></div><p class="muted" id="hint"></p><div id="list"></div><button class="btn" style="width:100%;margin-top:14px">Сохранить занятие</button></section>
<section class="card" id="desk"><div class="scroll"><table id="grid"></table></div><p class="muted">Нажмите на клетку: был → не был → пусто. Итог считается по цене из раздела «Цены».</p></section></div>
<script>
const kids=["Ирина К.","Мира Д.","Ксения М.","Варвара Б.","Полина С.","Анна Б."],days=[1,6,8,13],price=8;let cur=days[2];const a={};
kids.forEach((k,i)=>a[k]={1:1,6:i%4?1:0,8:i%3?1:undefined});
const cls=v=>v===1?'yes':v===0?'no':'',txt=v=>v===1?'✓':v===0?'—':'';
function set(k,d,v){a[k][d]=v;draw()}
function draw(){
document.getElementById('chips').innerHTML=days.map(d=>'<button class="'+(d===cur?'on':'')+'" onclick="cur='+d+';draw()">'+d+' окт</button>').join('');
const n=kids.filter(k=>a[k][cur]===1).length;document.getElementById('hint').textContent='Отмечено «был»: '+n+' из '+kids.length;
document.getElementById('list').innerHTML=kids.map(k=>'<div class="kid"><span>'+k+'</span><span class="btns"><button class="tg '+(a[k][cur]===1?'yes':'')+'" onclick="set(\''+k+'\','+cur+',1)">Был</button><button class="tg '+(a[k][cur]===0?'no':'')+'" onclick="set(\''+k+'\','+cur+',0)">Не был</button></span></div>').join('');
document.getElementById('grid').innerHTML='<thead><tr><th>Ребёнок</th>'+days.map(d=>'<th>'+d+' окт</th>').join('')+'<th class="num">Занятий</th><th class="num">К оплате</th></tr></thead><tbody>'+kids.map(k=>{const c=days.filter(d=>a[k][d]===1).length;return '<tr><td>'+k+'</td>'+days.map(d=>'<td><button class="cell '+cls(a[k][d])+'" onclick="set(\''+k+'\','+d+','+(a[k][d]===1?0:a[k][d]===0?'undefined':1)+')">'+txt(a[k][d])+'</button></td>').join('')+'<td class="num">'+c+'</td><td class="num">'+c*price+' BYN</td></tr>'}).join('')+'</tbody>';}
draw();
</script></body></html>
