<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>Преподаватели</title>
<style>
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;list-style:none}
summary:focus-visible{outline:3px solid #8E6CD8;outline-offset:4px}
.grp{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.grp b{display:flex;justify-content:space-between}
.grp ul{margin:6px 0 0;padding-left:18px;color:var(--mute);font-size:.92rem}
</style></head><body><header class="top"><b>Школа танцев</b><nav><a href="attendance.html">Посещаемость</a><a href="teachers.html">Преподаватели</a><a href="prices.html">Цены</a><a href="admin.html">Платежи</a><a href="parent.html">Вид родителя</a></nav></header>
<div class="page"><h1>Преподаватели</h1>
<div class="bar"><input id="q" type="search" placeholder="Найти преподавателя или ребёнка" style="flex:1;min-width:200px" aria-label="Поиск"></div>
<div class="cols" id="t"></div></div>
<script>
const T=[["Доброгост",[["7–9 лет","вт/чт 17:20",["Ирина К.","Мира Д.","Ксения М."]],["4–6 лет","вт/чт 18:20",["Варвара Б.","Полина С."]],["10–14 лет","вт/чт 19:00",["Анна Б.","Злата П."]]]],["Маринкина",[["5–7 лет","пн/ср 15:00",["Лиза Н.","Дарья Т."]],["10–14 лет","пн/ср 19:00",["Вера Л."]]]],["Решетник",[["6–8 лет","пн/ср 18:00",["Ника Ж.","Алиса Ч."]]]],["Сидоркина",[["8–9 лет","вт/чт 20:00",["Софья Р."]]]],["Ковалева",[["7–9 лет","пн/ср 18:00",["Мария Л."]]]]];
function draw(){const q=document.getElementById('q').value.toLowerCase();
document.getElementById('t').innerHTML=T.filter(t=>!q||t[0].toLowerCase().includes(q)||t[1].some(g=>g[2].some(k=>k.toLowerCase().includes(q)))).map(t=>{const n=t[1].reduce((s,g)=>s+g[2].length,0);
return '<details '+(q?'open':'')+'><summary><span>'+t[0]+'</span><span class="muted">'+t[1].length+' гр. · '+n+' детей</span></summary>'+t[1].map(g=>'<div class="grp"><b><span>'+g[0]+'</span><span class="muted">'+g[1]+'</span></b><ul>'+g[2].map(k=>'<li>'+k+'</li>').join('')+'</ul></div>').join('')+'</details>'}).join('')||'<p class="muted">Ничего не нашли — измените запрос</p>';}
document.getElementById('q').oninput=draw;draw();
</script></body></html>
